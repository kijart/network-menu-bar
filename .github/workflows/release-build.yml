name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. 0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG', expected X.Y.Z"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Build, sign and package
        run: make release

      - name: Upload the disk image and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/Network-Menu-Bar-$TAG.dmg"
          test -f "$dmg" || { echo "::error::$dmg not found; does MARKETING_VERSION match the tag?"; exit 1; }
          cat "$dmg.sha256" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber --repo "$GITHUB_REPOSITORY"
